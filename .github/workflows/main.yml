name: Main

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux x86_64
            runs_on: ubuntu-24.04
          - os_name: Linux arm64
            runs_on: ubuntu-24.04-arm
          - os_name: macOS x86_64
            runs_on: macos-15-intel
          - os_name: macOS arm64
            runs_on: macos-15
          # Default Visual Studio generator, i.e. MSVC; multi-config, so the
          # binaries land in build/Release.
          - os_name: Windows x86_64 (MSVC)
            runs_on: windows-2025
            benchmark: ./build/Release/sliding_dft_benchmark.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSLIDINGDFT_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Benchmark smoke run
        run: ${{ matrix.benchmark || './build/sliding_dft_benchmark' }} --benchmark_min_time=0.01s
